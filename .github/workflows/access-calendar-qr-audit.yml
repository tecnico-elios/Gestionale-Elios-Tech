name: Access calendar QR audit

on:
  push:
    branches:
      - audit/r2-warehouse-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: elios_access_audit
      JWT_SECRET: test-secret-only
      ADMIN_PASSWORD: test-admin-only
      CHECKLIST_RECIPIENTS: ""
      PUBLIC_FRONTEND_URL: http://127.0.0.1:8001
      UPLOAD_ROOT: /tmp/elios-access-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r backend/requirements.txt
      - name: Start isolated backend
        run: |
          mkdir -p "$UPLOAD_ROOT"
          cd backend
          nohup uvicorn server:app --host 127.0.0.1 --port 8001 >/tmp/elios-access-api.log 2>&1 &
      - name: Create isolated admin and base records
        run: python backend/integration_smoke.py
      - name: Test permissions calendar and QR
        run: python backend/security_calendar_qr_smoke.py
