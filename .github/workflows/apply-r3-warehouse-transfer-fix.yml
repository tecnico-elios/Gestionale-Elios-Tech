name: Apply R3 warehouse transfer fix

on:
  push:
    branches:
      - audit/r2-warehouse-check
    paths:
      - .github/workflows/apply-r3-warehouse-transfer-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/r2-warehouse-check
          fetch-depth: 0

      - name: Fix transfer response and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          inv = Path('backend/inventory_local.py')
          text = inv.read_text(encoding='utf-8')
          old = '''    await db.local_transfers.insert_one(doc)\n    return doc\n'''
          new = '''    await db.local_transfers.insert_one(doc)\n    # Motor/PyMongo aggiunge `_id` (ObjectId) al dict passato a insert_one.\n    # Non deve uscire dalla API: FastAPI non può serializzarlo e risponderebbe 500\n    # nonostante il trasferimento sia già stato eseguito.\n    doc.pop("_id", None)\n    return doc\n'''
          if old not in text:
              if new not in text:
                  raise SystemExit('Blocco transfer_stock non trovato')
          else:
              inv.write_text(text.replace(old, new, 1), encoding='utf-8')

          smoke = Path('backend/warehouse_operations_smoke.py')
          text = smoke.read_text(encoding='utf-8')
          text = text.replace(
              '''    expect(\n        "POST", "/api/warehouse/transfers", token=token,\n        json={"product_id": qty_id, "quantity": 3, "serials": [], "from_warehouse_id": "elios-tech", "to_warehouse_id": "verona", "note": "Audit quantità"},\n    )\n    expect(\n        "POST", "/api/warehouse/transfers", token=token,\n        json={"product_id": ser_id, "quantity": 1, "serials": ["AUD-R2-SN-002"], "from_warehouse_id": "elios-tech", "to_warehouse_id": "verona", "note": "Audit seriale"},\n    )\n''',
              '''    qty_transfer = expect(\n        "POST", "/api/warehouse/transfers", token=token,\n        json={"product_id": qty_id, "quantity": 3, "serials": [], "from_warehouse_id": "elios-tech", "to_warehouse_id": "verona", "note": "Audit quantità"},\n    ).json()["transfer"]\n    qty_verona_id = qty_transfer["target_product_id"]\n    ser_transfer = expect(\n        "POST", "/api/warehouse/transfers", token=token,\n        json={"product_id": ser_id, "quantity": 1, "serials": ["AUD-R2-SN-002"], "from_warehouse_id": "elios-tech", "to_warehouse_id": "verona", "note": "Audit seriale"},\n    ).json()["transfer"]\n    ser_verona_id = ser_transfer["target_product_id"]\n'''
          )
          text = text.replace(
              '''    assert float(inventory_item(inv_verona, qty_id).get("quantity") or 0) == 3\n    assert float(inventory_item(inv_elios, ser_id).get("quantity") or 0) == 1\n    assert float(inventory_item(inv_verona, ser_id).get("quantity") or 0) == 1\n''',
              '''    assert float(inventory_item(inv_verona, qty_verona_id).get("quantity") or 0) == 3\n    assert float(inventory_item(inv_elios, ser_id).get("quantity") or 0) == 1\n    assert float(inventory_item(inv_verona, ser_verona_id).get("quantity") or 0) == 1\n'''
          )
          text = text.replace(
              '''        json={"product_id": ser_id, "quantity": 1, "serials": ["AUD-R2-SN-002"], "from_warehouse_id": "verona", "to_warehouse_id": "elios-tech", "note": "Rientro audit"},\n''',
              '''        json={"product_id": ser_verona_id, "quantity": 1, "serials": ["AUD-R2-SN-002"], "from_warehouse_id": "verona", "to_warehouse_id": "elios-tech", "note": "Rientro audit"},\n'''
          )
          smoke.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-r3-warehouse-transfer-fix.yml

      - name: Validate
        run: python -m compileall -q backend

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R3: corregge risposta API trasferimenti magazzino'
          git push origin HEAD:audit/r2-warehouse-check
