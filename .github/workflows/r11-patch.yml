name: R11 controlled patch

on:
  push:
    branches:
      - fix/r11-prospect-senza-cliente

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'R11 — Prospect separati dai clienti') }}
    runs-on: ubuntu-latest
    env:
      DISABLE_ESLINT_PLUGIN: "true"
      GENERATE_SOURCEMAP: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r11-prospect-senza-cliente
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Applica patch controllata R11
        run: python r11_patch.py

      - name: Verifica compilazione backend
        run: python -m compileall -q backend

      - name: Installa frontend
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --legacy-peer-deps --no-audit --no-fund --save-dev ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit patch validata
        run: |
          rm -f r11_patch.py .github/workflows/r11-patch.yml
          git config user.name "Elios Tech CI"
          git config user.email "tecnico@eliostech.org"
          git add -A
          git diff --cached --check
          git commit -m "R11 — Prospect separati dai clienti"
          git push origin HEAD:fix/r11-prospect-senza-cliente
