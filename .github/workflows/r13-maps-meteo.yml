name: R13 maps e meteo sopralluoghi

on:
  push:
    branches: [fix/r13-maps-meteo-sopralluoghi]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Applica R13
        run: python scripts/r13_maps_meteo.py
      - name: Installa frontend
        working-directory: frontend
        run: npm install --legacy-peer-deps
      - name: Build frontend
        working-directory: frontend
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
        run: npm run build
      - name: Commit R13 validata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION frontend/src/pages/RegistryPage.jsx
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare"
            exit 0
          fi
          git commit -m "R13 — Maps e meteo nei sopralluoghi"
          git push
