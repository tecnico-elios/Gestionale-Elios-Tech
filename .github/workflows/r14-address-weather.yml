name: R14 indirizzo verificato e meteo

on:
  push:
    branches: [fix/r14-indirizzo-verificato-meteo]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Applica R14
        run: python scripts/r14_address_weather.py
      - name: Compila backend
        run: python -m compileall -q backend
      - name: Installa frontend
        working-directory: frontend
        run: npm install --legacy-peer-deps
      - name: Build frontend
        working-directory: frontend
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
        run: npm run build
      - name: Commit R14 validata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION backend/server.py frontend/src/components/InstallationWeather.jsx frontend/src/pages/RegistryPage.jsx frontend/src/pages/BusinessPages.jsx
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare"
            exit 0
          fi
          git commit -m "R14 — Indirizzo verificato, Maps e meteo coordinati"
          git push
