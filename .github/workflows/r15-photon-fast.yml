name: R15 Photon fast

on:
  push:
    branches: [fix/r15-photon-language]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Applica fix R15
        run: python scripts/r15_fix_photon.py
      - name: Test reale Photon
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          q = urllib.parse.urlencode({'q': 'via de nicola 15 piacenza', 'limit': 6})
          req = urllib.request.Request('https://photon.komoot.io/api/?' + q, headers={'User-Agent':'Gestionale-Elios-Tech/1.0 address-autocomplete'})
          with urllib.request.urlopen(req, timeout=10) as r:
              data = json.load(r)
          features = data.get('features') or []
          if not features:
              raise SystemExit('Photon non ha restituito risultati')
          print('Photon OK:', len(features), 'risultati')
          PY
      - name: Compila backend
        run: python -m compileall -q backend
      - name: Commit R15 validata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION backend/server.py
          if ! git diff --cached --quiet; then
            git commit -m "R15 — Correggi ricerca indirizzi Photon"
            git push
          fi
