name: R5 continuation patch

on:
  push:
    branches:
      - fix/r5-revisione-completa
    paths:
      - .github/workflows/r5-continuation.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Normalize legacy comment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/ChecklistPage.jsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('(clienteOrderId null)', '(clienteClientId null)')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply R5 continuation patch
        run: python scripts/apply_r5_continuation.py

      - name: Validate Python syntax
        run: python -m compileall -q backend

      - name: Validate diff
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --legacy-peer-deps --no-audit --no-fund --save-dev ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build frontend
        working-directory: frontend
        env:
          GENERATE_SOURCEMAP: "false"
          DISABLE_ESLINT_PLUGIN: "true"
        run: npm run build

      - name: Commit validated changes
        run: |
          rm -f scripts/apply_r5_continuation.py .github/workflows/r5-continuation.yml
          git config user.name "Elios Tech R5 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "R5: cliente e sede inline, analytics per ordine"
          git push origin HEAD:fix/r5-revisione-completa
