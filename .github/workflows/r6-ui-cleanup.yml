name: R6 UI cleanup

on:
  push:
    branches:
      - fix/r6-ui-cleanup
    paths:
      - .github/workflows/r6-ui-cleanup.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply R6 UI cleanup
        run: python scripts/apply_r6_ui_cleanup.py

      - name: Validate diff
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund --package-lock=false

      - name: Build frontend
        working-directory: frontend
        env:
          GENERATE_SOURCEMAP: "false"
          DISABLE_ESLINT_PLUGIN: "true"
        run: npm run build

      - name: Commit validated changes
        run: |
          rm -f scripts/apply_r6_ui_cleanup.py .github/workflows/r6-ui-cleanup.yml frontend/package-lock.json
          git config user.name "Elios Tech R6 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "R6: ripristina titoli responsive e distingue i report"
          git push origin HEAD:fix/r6-ui-cleanup
