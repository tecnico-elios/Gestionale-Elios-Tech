name: R7 permissions dashboard

on:
  push:
    branches:
      - fix/r7-permessi-dashboard
    paths:
      - .github/workflows/r7-permissions-dashboard.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply R7 hardening
        run: python scripts/apply_r7_permissions_dashboard.py

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Structural audit with permission regression
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: elios_r7_patch_audit
          JWT_SECRET: elios-r7-test-secret
          ADMIN_PASSWORD: audit-admin-password
          CHECKLIST_RECIPIENTS: ""
          PUBLIC_FRONTEND_URL: http://127.0.0.1:8001
        run: python backend/system_audit.py

      - name: Validate diff
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund --package-lock=false

      - name: Build frontend
        working-directory: frontend
        env:
          GENERATE_SOURCEMAP: "false"
          DISABLE_ESLINT_PLUGIN: "true"
        run: npm run build

      - name: Commit validated changes
        run: |
          rm -f scripts/apply_r7_permissions_dashboard.py .github/workflows/r7-permissions-dashboard.yml frontend/package-lock.json
          git config user.name "Elios Tech R7 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "R7: allinea permessi API e dashboard"
          git push origin HEAD:fix/r7-permessi-dashboard
