name: R8 clean diff

on:
  push:
    branches:
      - fix/r8-sicurezza-coerenza

permissions:
  contents: write

jobs:
  clean:
    if: ${{ github.event.head_commit.message == 'ci: pulizia finale diff R8' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r8-sicurezza-coerenza
          fetch-depth: 0
      - name: Restore package manifest byte-for-byte from main
        run: |
          git fetch origin main
          git checkout origin/main -- frontend/package.json
          rm -f .github/workflows/r8-clean-diff.yml
          git config user.name "Elios Tech CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: pulisce diff R8"
          git push origin HEAD:fix/r8-sicurezza-coerenza
