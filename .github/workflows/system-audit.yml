name: Gestionale system audit

on:
  push:
    branches:
      - audit/r1-system-check
      - audit/r2-warehouse-check
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: elios_system_audit
      JWT_SECRET: elios-system-audit-secret-not-production
      ADMIN_PASSWORD: audit-admin-password
      CHECKLIST_RECIPIENTS: ""
      PUBLIC_FRONTEND_URL: http://127.0.0.1:8001
      REACT_APP_BACKEND_URL: ""
      GENERATE_SOURCEMAP: "false"
      DISABLE_ESLINT_PLUGIN: "true"
      UPLOAD_ROOT: /tmp/elios-audit-uploads

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.mongo.id }} mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB non disponibile" >&2
          exit 1

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Structural audit
        run: python backend/system_audit.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --legacy-peer-deps --no-audit --no-fund --save-dev ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build production Docker image
        run: docker build -t gestionale-elios-audit .

      - name: Start isolated backend
        run: |
          mkdir -p "$UPLOAD_ROOT"
          cd backend
          export FRONTEND_BUILD_DIR="$GITHUB_WORKSPACE/frontend/build"
          nohup uvicorn server:app --host 127.0.0.1 --port 8001 >/tmp/elios-api.log 2>&1 &
          echo $! >/tmp/elios-api.pid

      - name: Integration smoke test
        run: |
          if ! python backend/integration_smoke.py; then
            echo "---- backend log ----"
            cat /tmp/elios-api.log || true
            exit 1
          fi

      - name: Warehouse and commesse smoke test
        id: warehouse
        shell: bash
        run: |
          set +e
          python backend/warehouse_operations_smoke.py > /tmp/warehouse-smoke.log 2>&1
          code=$?
          cat /tmp/warehouse-smoke.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save warehouse diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-diagnostics
          path: |
            /tmp/warehouse-smoke.log
            /tmp/elios-api.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fail if warehouse smoke failed
        if: steps.warehouse.outputs.exit_code != '0'
        run: |
          echo "Warehouse/commesse smoke test failed with exit code ${{ steps.warehouse.outputs.exit_code }}"
          exit 1

      - name: Production unauthenticated smoke test
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 https://gestionale-elios-tech.onrender.com/ -o /tmp/live.html
          grep -q "Gestionale Elios Tech" /tmp/live.html

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/elios-api.pid ]; then kill "$(cat /tmp/elios-api.pid)" || true; fi
