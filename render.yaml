services:
  - type: web
    name: gestionale-elios-tech
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/build-info
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: elios_tech
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: PUBLIC_FRONTEND_URL
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_INVENTARIO_DS_ID
        sync: false
      - key: NOTION_TRACKER_DS_ID
        sync: false
      - key: NOTION_RECEIPTS_DS_ID
        sync: false
      - key: NOTION_ORDINI_DS_ID
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: UPLOAD_ROOT
        value: /app/data/uploads/installazioni
